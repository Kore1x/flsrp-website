<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101113">
  <title>Florida State Roleplay</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div class="brand-mark" aria-hidden="true">F</div>
      <h1>Florida State Roleplay</h1>
      <p>Select a department or portal to continue</p>
    </header>

    <section class="department-grid" aria-label="Department menu">
      <button class="department-card" data-destination="fhp" aria-label="Open Florida Highway Patrol">
        <span class="logo-wrap"><img src="/assets/fhp.png" alt="Florida Highway Patrol logo"></span>
        <span class="card-title">Florida Highway Patrol</span>
        <span class="card-subtitle">FHP · Highway Enforcement</span>
        <span class="card-action">Enter department <span aria-hidden="true">↗</span></span>
      </button>
      <button class="department-card" data-destination="ems" aria-label="Open Orlando EMS">
        <span class="logo-wrap"><img src="/assets/ems.png" alt="Emergency Medical Services logo"></span>
        <span class="card-title">Orlando EMS</span>
        <span class="card-subtitle">EMS · Medical Services</span>
        <span class="card-action">Enter department <span aria-hidden="true">↗</span></span>
      </button>
      <button class="department-card" data-destination="fire" aria-label="Open Orlando Fire Department">
        <span class="logo-wrap"><img src="/assets/fire.png" alt="Orlando Fire Department logo"></span>
        <span class="card-title">Orlando Fire Department</span>
        <span class="card-subtitle">OFD · Fire Rescue</span>
        <span class="card-action">Enter department <span aria-hidden="true">↗</span></span>
      </button>
      <button class="department-card" data-destination="opd" aria-label="Open Orlando Police Department">
        <span class="logo-wrap"><img src="/assets/opd.png" alt="Orlando Police Department logo"></span>
        <span class="card-title">Orlando Police Department</span>
        <span class="card-subtitle">OPD · Police Services</span>
        <span class="card-action">Enter department <span aria-hidden="true">↗</span></span>
      </button>
      <button class="department-card" data-destination="civilian" aria-label="Open Civilian Portal">
        <span class="logo-wrap civilian-wrap"><img src="/assets/civilian.png" alt="Civilian icon"></span>
        <span class="card-title">Civilian Portal</span>
        <span class="card-subtitle">Your profile · Vehicles · Businesses</span>
        <span class="card-action">Open portal <span aria-hidden="true">↗</span></span>
      </button>
      <button class="department-card" data-destination="dispatch" aria-label="Open Dispatch Center">
        <span class="logo-wrap"><img src="/assets/dispatch.png" alt="911 dispatch headset icon"></span>
        <span class="card-title">Dispatch Center</span>
        <span class="card-subtitle">Live incidents · On-duty units</span>
        <span class="card-action">Open dispatch <span aria-hidden="true">↗</span></span>
      </button>
    </section>

    <footer>
      <span class="status-dot"></span>
      <span>FLSRP · Community roleplay portal</span>
    </footer>
  </main>
  <dialog id="notice" class="notice">
    <button class="close" aria-label="Close dialog">×</button>
    <div class="notice-icon">i</div>
    <h2 id="notice-title">Portal setup</h2>
    <p id="notice-copy">This section will be connected during the backend integration step.</p>
    <button class="primary-button close-action">Got it</button>
  </dialog>
  <script src="/app.js"></script>
</body>
</html>
